<!DOCTYPE html>
<html lang="en">
<head>
<title>Document</title>
</head>
<body>
<h1>Chuck Norris</h1>
<button id="btn">Click for joke</button>
<p id="joke"></p>

<script>
  const btn = document.getElementById('btn')
  const par = document.getElementById('joke')

  
  async function getJoke() {
    const joke = await fetch('https://api.chucknorris.io/jokes/random?category=dev')

    jsonJoke = await joke.json()
    console.log(jsonJoke)
    par.innerText = jsonJoke.value
  }
  
  btn.addEventListener('click', getJoke)
</script>
</body>
</html>
